[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-snake"
version = "0.1.0"
description = "A terminal-first snake game with power-ups and a persistent leaderboard."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
license = { text = "MIT" }
dependencies = []

[project.scripts]
snake-game = "snake_game.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
